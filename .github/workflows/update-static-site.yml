name: Update Static Site
run-name: GitHub bot is creating and updating static contents for the GiHub Pages repo.
on:
  push:
    branches: [main, feature/**]

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6  # @note: it checkout *this* repo. as $GITHUB_WORKSPACE
      with:
        submodules: recursive
        fetch-depth: 1
        token: ${{ secrets.PD_SITE_MAINTE }}

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build the mmd2html converter
      run: |
        cd mmd2html
        chmod +x ./gradlew
        ./gradlew build

    - name: Clone the *public* deployment repo
      uses: actions/checkout@v6
      with:
        repository: madpang/madpang.github.io
        ref: gh-pages
        fetch-depth: 1
        path: public
        token: ${{ secrets.PD_SITE_MAINTE }}

    - name: Retrieve the already *deployed* post index
      run: |
        mkdir workspace
        cp public/artifacts/post-index.txt workspace/deployed-post-index.txt

    - name: Build the posts
      run: |
        pwsh -nop ./scripts/prepare-build.ps1
        pwsh -nop ./scripts/export-build.ps1

    - name: Sync build artifacts to deployment repo
      run: |
        pwsh -nop ./scripts/deploy-build.ps1
        cp index.html public/index.html
        rsync -av --delete commons/ public/commons/

    - name: Commit and Push the changes to gh-pages branch
        run: |
          cd public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff

